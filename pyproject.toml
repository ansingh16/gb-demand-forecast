[project]
name = "gb-demand-forecast"
version = "0.1.0"
description = "Day-ahead probabilistic forecasts of GB electricity demand, scored against NESO's published forecast"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.4",
    "requests>=2.31",
    "pyarrow>=15",
    "holidays>=0.54",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tabulate>=0.9",
]

[dependency-groups]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "matplotlib>=3.8.1"]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]
tracking = [
    "mlflow>=3.0",
]
pipeline = [
    "dvc>=3.50",
]

[tool.uv]
default-groups = ["notebooks", "dev", "tracking", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gb_demand"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
