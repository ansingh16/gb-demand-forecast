name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: install
        run: uv sync --frozen --no-default-groups --group dev
      - name: lint
        run: uv run --no-sync ruff check .
      - name: test
        run: uv run --no-sync pytest -q

  dags:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: install airflow
        run: uv sync --frozen
      - name: dags import
        run: uv run --no-sync pytest -q tests
